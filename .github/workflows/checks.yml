name: Checks

# The fast checks a WORLD can run in CI: everything that needs neither the platform repository nor
# the engine. `verify-world.sh` proves more, and needs MYTHICAL_FORGE_ROOT (the platform is private),
# so it stays a local, pre-commit step; this is the net that catches a broken note, a rotted citation
# or an unclassified section on every push.
#
# The kit ships this file and `tools/sync-tooling.sh` writes it into a world; a world may edit its
# copy, and the next sync will replace it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # NOTE: `tools/check-guide.mjs` is deliberately NOT run here. It parses the guide's blocks with
      # the platform's own schema (`@mythical-forge/authored-content`, from MYTHICAL_FORGE_ROOT), and
      # the platform repository is private: a runner cannot have it. Run it locally, before a commit
      # that touches the authoring guide. Everything above and below is standard-library only.

      # This workflow ships to every world, and to the kit and the template as well. Two of the checks
      # below are statements about a WORLD and are meaningless for the other two: the disclosure gate
      # fails on a fixture's deliberately unreviewed sections, and the suites assert a real world's
      # vocabularies, where a template has `REPLACE`. The kit is the repository with verify-kit.sh at
      # its root (a world has verify-world.sh); an uninhabited fork says `template: true`.
      - name: Is this a world?
        id: kind
        run: |
          if [ -f verify-kit.sh ] || grep -qE '^[[:space:]]*template:[[:space:]]*true' world.config.yaml; then
            echo "world=false" >> "$GITHUB_OUTPUT"
            echo "this repository is a kit or an uninhabited template: the world-only checks are skipped"
          else
            echo "world=true" >> "$GITHUB_OUTPUT"
          fi

      - name: The suites
        if: steps.kind.outputs.world == 'true'
        run: |
          for suite in tools/test_*.py; do
            echo "== $suite"
            python3 "$suite"
          done

      - name: Lint every note
        run: python3 tools/lint.py

      - name: The workflows will load
        run: python3 tools/check-workflows.py

      - name: Every section citation resolves
        run: python3 tools/check_citations.py

      - name: Every lore section has a disclosure class
        if: steps.kind.outputs.world == 'true'
        run: python3 tools/disclosure.py --check
