name: Checks

# The fast checks a WORLD can run in CI: everything that needs neither the platform repository nor
# the engine. `verify-world.sh` proves more, and needs MYTHICAL_FORGE_ROOT (the platform is private),
# so it stays a local, pre-commit step; this is the net that catches a broken note, a rotted citation
# or an unclassified section on every push.
#
# The kit ships this file and `tools/sync-tooling.sh` writes it into a world; a world may edit its
# copy, and the next sync will replace it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # NOTE: `tools/check-guide.mjs` is deliberately NOT run here. It parses the guide's blocks with
      # the platform's own schema (`@mythical-forge/authored-content`, from MYTHICAL_FORGE_ROOT), and
      # the platform repository is private: a runner cannot have it. Run it locally, before a commit
      # that touches the authoring guide. Everything above and below is standard-library only.

      # This workflow ships to every world, and to the kit and the template as well. One of the checks
      # below is a statement about a WORLD and is meaningless for the other two: the disclosure gate
      # fails on a fixture's deliberately unreviewed sections. The kit is the repository with
      # verify-kit.sh at its root (a world has verify-world.sh).
      - name: Is this a world?
        id: kind
        run: |
          if [ -f verify-kit.sh ] || grep -qE '^[[:space:]]*template:[[:space:]]*true' world.config.yaml; then
            echo "world=false" >> "$GITHUB_OUTPUT"
            echo "this repository is a kit or an uninhabited template: the world-only checks are skipped"
          else
            echo "world=true" >> "$GITHUB_OUTPUT"
          fi

      # The engine's schemas are the one thing CI cannot get for free: they are published on GitHub
      # Packages (Phase 5 B4), and the registry needs a token. Without one the checks that need them
      # are SKIPPED with a warning naming what was skipped — red-forever teaches nobody anything.
      # Add a secret named WORLDKIT_PACKAGES_TOKEN (read:packages on @curiouslittledroid) and this job
      # also proves the world compiles: transform, validate, thread-check and every scenario.
      - name: Are the engine's schemas available?
        id: schemas
        env:
          NODE_AUTH_TOKEN: ${{ secrets.WORLDKIT_PACKAGES_TOKEN }}
        run: |
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            echo "have=1" >> "$GITHUB_OUTPUT"
            npm install --no-audit --no-fund
          else
            echo "have=0" >> "$GITHUB_OUTPUT"
            echo "::warning::no WORLDKIT_PACKAGES_TOKEN: the world's own pipeline is SKIPPED."
            echo "::warning::The schemas are on GitHub Packages and need read:packages on @curiouslittledroid."
            echo "::warning::Locally, 'npm install && tools/verify-world.sh' runs the same checks."
          fi

      # The suites are deliberately NOT run here: `tools/test_*.py`. They are the kit's tests -- fixtures asserting the kit's own
      # code -- and a release cannot be tagged with one failing, because the kit's ci.yml runs all of
      # them on every commit. Running them in a world added no check the steps below do not make: the
      # three that read a real vault were `lint.py`, `disclosure.py --check` and `check_config.py` in
      # other clothes. What it did add was a red run an author could do nothing about, which is the
      # failure mode this kit keeps naming. They still ship, and `meta/conventions/tooling.md` says
      # when to run one by hand; and a vendored copy's integrity is `tooling-drift.yml`'s question,
      # answered by comparing files with the pinned tag rather than by executing them.

      # Before the notes, the file every tool reads first. A wrong id, a block that does not parse
      # or a site section that claims a kind twice makes the checks below quieter rather than
      # louder, so it is worth its own named step and its own line in the log. In the kit this
      # resolves to the demo world (`template/example-world/`); in a world, to that world.
      - name: The config and the vault agree
        run: python3 tools/check_config.py

      - name: Lint every note
        run: python3 tools/lint.py

      - name: The workflows will load
        run: python3 tools/check_workflows.py

      - name: Every section citation resolves
        run: python3 tools/check_citations.py

      # The kit's own documents teach with the demo world. A world holds them at meta/conventions/
      # and keeps example-world/, so the same check runs here; without a demo world it says so and
      # passes rather than inventing a verdict.
      - name: The kit's documents teach with the demo world's examples
        run: python3 tools/check_doc_examples.py

      - name: Every lore section has a disclosure class
        if: steps.kind.outputs.world == 'true'
        run: python3 tools/disclosure.py --check

      # The strongest proof this repository owns: the vault compiles into a Game Ready Repository the
      # engine's own schemas accept, and its scenarios still play. It needs the schemas, and it needs
      # to be a world (the kit proves itself with verify-kit.sh).
      - name: The world compiles, and its scenarios pass
        if: steps.schemas.outputs.have == '1' && steps.kind.outputs.world == 'true'
        run: tools/verify-world.sh
