name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  kit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: The Python suites
        run: |
          for suite in tools/test_*.py; do
            echo "== $suite"
            python3 "$suite"
          done

      - name: The demo world lints clean
        run: python3 tools/lint.py

      - name: Every section citation resolves
        run: python3 tools/check_citations.py

      # The engine's schemas are the one thing this job cannot get for free: they are published on
      # GitHub Packages (Phase 5 B4) and the registry needs a token. Without one, the checks that need
      # them are SKIPPED with a warning naming what was skipped -- red-forever teaches nobody
      # anything. Add a secret named WORLDKIT_PACKAGES_TOKEN (a token with read:packages on
      # @curiouslittledroid) and this job also runs the guide check and the whole pipeline,
      # ./verify-kit.sh, against the kit's own demo world.
      - name: Are the engine's schemas available?
        id: schemas
        env:
          NODE_AUTH_TOKEN: ${{ secrets.WORLDKIT_PACKAGES_TOKEN }}
        run: |
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            echo "have=1" >> "$GITHUB_OUTPUT"
            npm install --no-audit --no-fund
          else
            echo "have=0" >> "$GITHUB_OUTPUT"
            echo "::warning::no WORLDKIT_PACKAGES_TOKEN: the guide check and ./verify-kit.sh are SKIPPED."
            echo "::warning::The schemas are on GitHub Packages and need read:packages on @curiouslittledroid."
            echo "::warning::Locally, 'npm install && ./verify-kit.sh' runs the same checks."
          fi

      - name: The guide's blocks match the demo world
        if: steps.schemas.outputs.have == '1'
        run: node tools/check-guide.mjs

      - name: The protocol region is in sync
        run: python3 tools/sync-agent-protocol.py --check

      # The kit's own end-to-end proof, which used to be local-only for want of exactly this: the
      # demo world is built into a Game Ready Repository, the engine's schemas accept it, and the six
      # fixture scenarios still play.
      - name: The whole pipeline, against the demo world
        if: steps.schemas.outputs.have == '1'
        run: ./verify-kit.sh

      # The invariant: no world's identity inside the kit's own machinery. Scoped on purpose -
      # CHANGELOG, README, ROADMAP, CONTRIBUTING and meta/platform-requests are PROVENANCE, and
      # they exist to say where the kit came from and who asked for what -- and `docs/extraction.md`
      # (excluded by basename: `--exclude` matches names, not paths, which is worth knowing)
      # is the longest piece of provenance in the repository: it is the record of the extraction,
      # so it names the world it extracted from, throughout. A world's identity in a
      # tool, a template, an agent prompt, a doc's mechanism or the demo world's config is the defect.
      # `.pi/prompts/` is included because it was not, and a prompt arrived full of one world's
      # monster rules. `site/` is excluded until K6 settles the theme's default look (the first
      # world's art style and prompts are in there, deliberately, as the worked example).
      - name: No world identity in the machinery
        run: |
          if grep -rIn --exclude-dir=.git --exclude-dir=node_modules \
               --exclude=CHANGELOG.md --exclude=README.md --exclude=ROADMAP.md \
               --exclude=CONTRIBUTING.md --exclude=extraction.md \
               -e 'world_hollowfall' -e 'hollowfall-' -e 'Hollowfall' \
               docs/ tools/ meta/templates/ world/ campaigns/ .pi/prompts/ world.config.yaml 2>/dev/null; then
            echo "::error::a world's identity is inside the kit's machinery."
            echo "  A template names no world; a doc's mechanism names none; the demo world is not the first world."
            exit 1
          fi
          echo "clean: no world identity in docs/, tools/, meta/templates/, the demo world or the config"

      # NOT run here: ./verify-kit.sh. It needs MYTHICAL_FORGE_ROOT - the platform repository, which
      # is private - because the transformer and the validator are the engine's own code. It is a
      # local step before a tag. See ROADMAP.md, "Verification".
      - name: Note what CI cannot prove
        run: |
          echo "verify-kit.sh is a local, pre-tag step (needs MYTHICAL_FORGE_ROOT)."
