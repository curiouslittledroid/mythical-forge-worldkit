name: Template fork

# The question the kit exists to answer: can somebody start a NEW world from the kit today, and have
# it work?
#
# The template repository is GENERATED (`export-template.sh`), so this job does not sync into it.
# It EXPORTS a template from this commit, initialises it with `init-world.sh` exactly as a new author
# would, and runs everything that does not need the platform repository.
#
# The export step runs unconditionally: an export that produces a broken tree is the kit's defect,
# and it must be caught even when the published template repository is unreachable. Fetching the
# published template afterwards is only to say how far behind this commit it is -- the template moves
# at milestones, not on every commit, so a difference is expected and is reported, never failed.
#
# `tools/verify-world.sh` -- the engine pipeline -- needs MYTHICAL_FORGE_ROOT and stays a local step,
# so this job prints what it could not prove rather than pretending it did.
#
# Not shipped to worlds: this is the kit's own job.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/**
      - docs/**
      - template/**
      - site-theme/**
      - export-template.sh
      - .github/workflows/template-fork.yml

permissions:
  contents: read

env:
  TEMPLATE_REPO: ${{ vars.WORLD_TEMPLATE_REPO || 'curiouslittledroid/mythical-forge-world-template' }}
  NODE_VERSION: '22'
  PYTHON_VERSION: '3.12'

jobs:
  fork:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: kit
          fetch-depth: 0        # the whole history, so the tag list is complete
          fetch-tags: true      # without this `git describe --tags` finds nothing and the pin is bogus

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # --- The export, proven on its own ------------------------------------------------------
      - name: Export a template from this commit
        id: export
        run: |
          set -eu
          latest="$(git -C "$GITHUB_WORKSPACE/kit" tag --list 'v*' | sort -V | tail -1)"
          echo "newest kit tag: ${latest:-none}"
          # `--worktree` exports the commit this job checked out. Passing a tag would export the
          # last release instead, which is exactly the thing this job is meant to catch -- a change
          # on this commit that breaks the export would pass unnoticed.
          cd kit
          ./export-template.sh --worktree --force /tmp/template
          echo "pin=$(cat /tmp/template/TOOLING_VERSION)" >> "$GITHUB_OUTPUT"

      # The normal destination is a checkout of the template repository on a branch, so the export
      # has to replace that tree and leave `.git` alone. Both halves are asserted here, because a
      # finished export looked perfect the one time it took the repository with it.
      - name: Exporting over an existing checkout keeps its .git
        run: |
          set -eu
          rm -rf /tmp/over
          mkdir -p /tmp/over/meta
          git -C /tmp/over init -q -b main
          git -C /tmp/over -c user.email=ci@example.invalid -c user.name=ci \
            commit -q --allow-empty -m base
          echo stray > /tmp/over/meta/left-behind.md
          base="$(git -C /tmp/over rev-parse HEAD)"
          cd kit
          ./export-template.sh --worktree --force /tmp/over
          # .git survived, history with it
          [ "$base" = "$(git -C /tmp/over rev-parse HEAD)" ]
          # the tree was replaced, not merged into
          [ ! -e /tmp/over/meta/left-behind.md ]
          # and the result is exactly a fresh export
          diff -rq --exclude=.git /tmp/template /tmp/over

      - name: The export has everything a world needs
        run: |
          set -eu
          missing=0
          for rel in \
              world.config.yaml init-world.sh AGENTS.md README.md ROADMAP.md LICENSE \
              principles/_index.md world/_index.md maps/_index.md campaigns/_index.md \
              meta/_index.md meta/templates/npc.md meta/conventions/conventions.md \
              meta/conventions/licensing.md meta/conventions/agent-protocol.md \
              meta/conventions/tooling.md \
              .pi/prompts/new-creature.md \
              tools/lint.py tools/check_config.py tools/verify-world.sh tools/sync-tooling.sh \
              tools/LICENSE tools/LICENSE-CONTENT \
              site/astro.config.mjs site/src/lib/site.ts \
              site/public/favicon.svg \
              site/src/pages/index.astro site/src/pages/about.astro site/src/pages/follow.astro \
              .github/workflows/checks.yml .github/workflows/site.yml \
              .github/workflows/tooling-drift.yml \
              example-world/world.config.yaml example-world/world/flags.md \
              TOOLING_VERSION
          do
            if [ ! -e "/tmp/template/$rel" ]; then
              echo "::error::the exported template is missing $rel"; missing=1
            fi
          done
          # The retired path must NOT come back: the documents live at meta/conventions/ now.
          if [ -d /tmp/template/tools/docs ]; then
            echo "::error::the export still carries tools/docs/ (retired: the kit's documents are meta/conventions/)"
            missing=1
          fi
          [ "$missing" -eq 0 ] && echo "the export is complete, and carries nothing it should not"
          exit "$missing"

      # --- The fork, given an identity -------------------------------------------------------
      - name: Fork it, and give it an identity
        run: |
          set -eu
          mkdir -p /tmp/fork && cp -r /tmp/template/. /tmp/fork/
          cd /tmp/fork
          ./init-world.sh --title "Fork Test" --yes
          # What `init-world.sh` must have done is replace the IDENTITY values. Demanding that no
          # `REPLACE_ME` survive anywhere was wrong from the day it was written: the template ships
          # placeholders in its pages, its calendar and its agent brief, and those are the author's
          # own to-do list -- lint reports them as warnings for exactly that reason. Two runs of this
          # job were needed to find that, because the first failure was the check itself.
          if grep -q 'REPLACE_ME' world.config.yaml; then
            echo "::error::init-world.sh left a REPLACE_ME in the config:"; grep -n 'REPLACE_ME' world.config.yaml; exit 1
          fi
          grep -q 'Fork Test' AGENTS.md || { echo "::error::the fork's title did not reach AGENTS.md"; exit 1; }
          echo "the identity was replaced; what remains is the new author's, and lint lists it:"
          grep -rIl REPLACE_ME --exclude-dir=tools --exclude-dir=dist --exclude-dir=node_modules --exclude=init-world.sh . | sed 's/^/  /' || true

      # The demo world is the author's worked example, so it STAYS. It is also the one thing an
      # author can delete by hand and want back, so the repair is proved here rather than shipped
      # on trust. WORLDKIT_REPO points at the checkout this job ran on, so the fetch is offline.
      - name: The demo world stays, and can be fetched again
        working-directory: /tmp/fork
        run: |
          set -eu
          [ -f example-world/world.config.yaml ] \
            || { echo "::error::init-world.sh removed the demo world"; exit 1; }
          [ -f example-world/world/flags.md ] \
            || { echo "::error::the demo world is incomplete"; exit 1; }
          rm -rf example-world
          WORLDKIT_REPO="$GITHUB_WORKSPACE/kit" ./init-world.sh --fetch-example
          [ -f example-world/world.config.yaml ] \
            || { echo "::error::--fetch-example did not restore the demo world"; exit 1; }
          if WORLDKIT_REPO="$GITHUB_WORKSPACE/kit" ./init-world.sh --fetch-example 2>/dev/null; then
            echo "::error::--fetch-example overwrote an example-world/ that was still there"; exit 1
          fi

      - name: Are the engine's schemas available?
        id: schemas
        env:
          NODE_AUTH_TOKEN: ${{ secrets.WORLDKIT_PACKAGES_TOKEN }}
        run: |
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            echo "have=1" >> "$GITHUB_OUTPUT"
          else
            echo "have=0" >> "$GITHUB_OUTPUT"
            echo "::warning::no WORLDKIT_PACKAGES_TOKEN: the fork's own pipeline (verify-world.sh) is SKIPPED."
            echo "::warning::The schemas are on GitHub Packages and need read:packages on @curiouslittledroid."
          fi

      - name: The checks a new world can run
        working-directory: /tmp/fork
        run: |
          set -eu
          # NOT the whole suite set, and not the disclosure gate. Both assert a REAL world's
          # vocabularies -- its tags, its sections, its tellers -- and a fresh fork still has the
          # template's placeholders in them, which are the new author's to-do list rather than a
          # defect. lint counts what remains. This is the same line checks.yml draws between a world
          # and a template, and it was the second thing this job got wrong about a fresh fork.
          python3 tools/lint.py
          python3 tools/check_config.py
          python3 tools/check_citations.py
          python3 tools/check_workflows.py
          echo "== what this fork still has to fill in:"
          python3 tools/lint.py 2>&1 | tail -1
          # The strongest proof a fork owns, and the reason this job exists: its vault compiles into a
          # Game Ready Repository the engine's own schemas accept. They come from a private registry,
          # so without a token this is skipped and the checks above are all there is.
          if [ "${{ steps.schemas.outputs.have }}" = "1" ]; then
            npm install --no-audit --no-fund
            tools/verify-world.sh
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.WORLDKIT_PACKAGES_TOKEN }}

      - name: The site a new world gets
        working-directory: /tmp/fork
        run: |
          set -eu
          python3 tools/site_export.py
          npm --prefix site install --silent
          npm --prefix site run build
          python3 tools/site_link_check.py
          echo "== the audit"
          python3 - <<'PY'
          import json
          d = json.load(open("site/audit/latest.json"))
          def n(k):
              v = d.get(k, 0)
              return len(v) if isinstance(v, list) else v
          print(f"pages {n('pages')} | unresolved {n('unresolved')} | keyword hits {n('keyword_hits')}")
          if n("unresolved"):
              raise SystemExit("a fresh fork's audit has unresolved references")
          PY

      # --- How far behind is the published template? -----------------------------------------
      # Informational only. The template moves at milestones, so a difference here is normal; what
      # would be a defect -- a broken export -- was already caught above, on its own.
      - name: How far behind is the published template?
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: ${{ env.TEMPLATE_REPO }}
          path: published
          token: ${{ secrets.TEMPLATE_TOKEN || github.token }}

      - name: Report the difference
        run: |
          set -eu
          if [ ! -d published ]; then
            echo "::warning::cannot fetch $TEMPLATE_REPO (private, or not published yet):"
            echo "          the comparison did not run. A private template needs a TEMPLATE_TOKEN."
            exit 0
          fi
          if diff -rq --exclude=.git --exclude=node_modules --exclude=dist \
               /tmp/template published > /tmp/diff.txt 2>&1; then
            echo "the published template matches a fresh export of this commit exactly"
          else
            echo "::notice::$TEMPLATE_REPO differs from a fresh export of this commit by" \
                 "$(wc -l < /tmp/diff.txt | tr -d ' ') path(s). Expected between milestones."
            sed 's/^/  /' /tmp/diff.txt | head -40
            echo "  Publish the difference at the next milestone:  ./export-template.sh <tag>"
          fi

      - name: What this job did not prove
        if: steps.schemas.outputs.have != '1'
        run: |
          echo "Not run: tools/verify-world.sh (the fork's own pipeline), because no"
          echo "WORLDKIT_PACKAGES_TOKEN secret is set and the engine's schemas are on a private"
          echo "registry. Add one (read:packages on @curiouslittledroid) and this job runs it."
