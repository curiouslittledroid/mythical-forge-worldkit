name: Template fork

# The question the kit exists to answer: can somebody start a NEW world from the template today, with
# the released kit, and have it work? T12 answered it by hand once; this runs it whenever the kit
# changes.
#
# It forks the published template, syncs the newest kit tag into it (which is what a new author's
# first minute looks like), initialises the world with `init-world.sh`, and runs everything that does
# not need the platform repository. `tools/verify-world.sh` -- the engine pipeline -- needs
# MYTHICAL_FORGE_ROOT and stays a local step, so this job prints what it could not prove rather than
# pretending it did.
#
# Not shipped to worlds: this is the kit's own job.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/**
      - docs/**
      - meta/templates/**
      - site-theme/**
      - .pi/prompts/**
      - .github/workflows/template-fork.yml

permissions:
  contents: read

env:
  TEMPLATE_REPO: ${{ vars.WORLD_TEMPLATE_REPO || 'curiouslittledroid/mythical-forge-world-template' }}
  NODE_VERSION: '22'
  PYTHON_VERSION: '3.12'

jobs:
  fork:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: kit
          fetch-depth: 0        # the whole history, so the tag list is complete
          fetch-tags: true      # `git tag --list` is empty without this, and a sync of "" is a no-op

      - name: Fetch the template
        id: template
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: ${{ env.TEMPLATE_REPO }}
          path: template
          token: ${{ secrets.TEMPLATE_TOKEN || github.token }}

      - name: Say so, if the template is not reachable
        if: steps.template.outcome != 'success'
        run: |
          echo "::warning::cannot fetch $TEMPLATE_REPO (private, or not published yet): the fork proof did not run."
          echo "          A private template needs a TEMPLATE_TOKEN secret with read access to it."

      - uses: actions/setup-python@v5
        if: steps.template.outcome == 'success'
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        if: steps.template.outcome == 'success'
        with:
          node-version: '22'

      - name: Sync the newest kit tag into the template
        if: steps.template.outcome == 'success'
        run: |
          set -eu
          cd template
          latest="$(git -C "$GITHUB_WORKSPACE/kit" tag --list 'v*' | sort -V | tail -1)"
          echo "newest kit tag: ${latest:-none}"
          if [ -z "$latest" ]; then
            echo "::error::no v* tag is present in the checkout, so there is nothing to sync. The"
            echo "::error::checkout must fetch tags: pass fetch-depth: 0 and fetch-tags: true."
            exit 1
          fi
          WORLDKIT_REPO="$GITHUB_WORKSPACE/kit" tools/sync-tooling.sh "$latest"
          cat TOOLING_VERSION

      - name: Are the engine's schemas available?
        id: schemas
        if: steps.template.outcome == 'success'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.WORLDKIT_PACKAGES_TOKEN }}
        run: |
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            echo "have=1" >> "$GITHUB_OUTPUT"
          else
            echo "have=0" >> "$GITHUB_OUTPUT"
            echo "::warning::no WORLDKIT_PACKAGES_TOKEN: the fork's own pipeline (verify-world.sh) is SKIPPED."
            echo "::warning::The schemas are on GitHub Packages and need read:packages on @curiouslittledroid."
          fi

      - name: Fork it, and give it an identity
        if: steps.template.outcome == 'success'
        run: |
          set -eu
          mkdir -p /tmp/fork && cp -r template/. /tmp/fork/
          cd /tmp/fork
          ./init-world.sh --title "Fork Test" --yes
          # What `init-world.sh` must have done is replace the IDENTITY values. Demanding that no
          # `REPLACE_ME` survive anywhere was wrong from the day it was written: the template ships
          # placeholders in its pages, its calendar and its agent brief, and those are the author's
          # own to-do list -- lint reports them as warnings for exactly that reason. Two runs of this
          # job were needed to find that, because the first failure was the check itself.
          if grep -q 'REPLACE_ME' world.config.yaml; then
            echo "::error::init-world.sh left a REPLACE_ME in the config:"; grep -n 'REPLACE_ME' world.config.yaml; exit 1
          fi
          grep -q 'Fork Test' AGENTS.md || { echo "::error::the fork's title did not reach AGENTS.md"; exit 1; }
          echo "the identity was replaced; what remains is the new author's, and lint lists it:"
          grep -rIl REPLACE_ME --exclude-dir=tools --exclude-dir=dist --exclude-dir=node_modules --exclude=init-world.sh . | sed 's/^/  /' || true

      - name: The checks a new world can run
        if: steps.template.outcome == 'success'
        working-directory: /tmp/fork
        run: |
          set -eu
          # NOT the whole suite set, and not the disclosure gate. Both assert a REAL world's
          # vocabularies -- its tags, its sections, its tellers -- and a fresh fork still has the
          # template's placeholders in them, which are the new author's to-do list rather than a
          # defect. lint counts what remains. This is the same line checks.yml draws between a world
          # and a template, and it was the second thing this job got wrong about a fresh fork.
          python3 tools/lint.py
          python3 tools/check_citations.py
          python3 tools/check_workflows.py
          echo "== what this fork still has to fill in:"
          python3 tools/lint.py 2>&1 | tail -1
          # The strongest proof a fork owns, and the reason this job exists: its vault compiles into a
          # Game Ready Repository the engine's own schemas accept. They come from a private registry,
          # so without a token this is skipped and the checks above are all there is.
          if [ "${{ steps.schemas.outputs.have }}" = "1" ]; then
            npm install --no-audit --no-fund
            tools/verify-world.sh
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.WORLDKIT_PACKAGES_TOKEN }}

      - name: The site a new world gets
        if: steps.template.outcome == 'success'
        working-directory: /tmp/fork
        run: |
          set -eu
          python3 tools/site_export.py
          npm --prefix site install --silent
          npm --prefix site run build
          python3 tools/site_link_check.py
          echo "== the audit"
          python3 - <<'PY'
          import json
          d = json.load(open("site/audit/latest.json"))
          def n(k):
              v = d.get(k, 0)
              return len(v) if isinstance(v, list) else v
          print(f"pages {n('pages')} | unresolved {n('unresolved')} | keyword hits {n('keyword_hits')}")
          if n("unresolved"):
              raise SystemExit("a fresh fork's audit has unresolved references")
          PY

      - name: What this job did not prove
        if: steps.template.outcome == 'success' && steps.schemas.outputs.have != '1'
        run: |
          echo "Not run: tools/verify-world.sh (the fork's own pipeline), because no"
          echo "WORLDKIT_PACKAGES_TOKEN secret is set and the engine's schemas are on a private"
          echo "registry. Add one (read:packages on @curiouslittledroid) and this job runs it."
